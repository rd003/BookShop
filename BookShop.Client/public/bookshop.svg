<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Book Pages Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Accent Gradient (Cart / Bookmark / Sparkles) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>

    <filter id="cartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded App Tile Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Main Icon Group with Drop Shadow -->
  <g filter="url(#dropShadow)">
    
    <!-- Open Book Base -->
    <!-- Left Page -->
    <path d="M 112 180 C 160 170, 224 185, 246 200 L 246 370 C 224 355, 160 340, 112 350 Z" fill="url(#pageGrad)" />
    
    <!-- Right Page -->
    <path d="M 400 180 C 352 170, 288 185, 266 200 L 266 370 C 288 355, 352 340, 400 350 Z" fill="url(#pageGrad)" />

    <!-- Spine / Center Fold -->
    <path d="M 246 200 L 256 205 L 266 200 L 266 370 L 256 375 L 246 370 Z" fill="#cbd5e1" />

    <!-- Page Details / Subtle Lines (Left) -->
    <path d="M 140 220 C 175 212, 215 222, 230 230" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 140 250 C 175 242, 215 252, 230 260" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 140 280 C 175 272, 215 282, 230 290" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Page Details / Subtle Lines (Right) -->
    <path d="M 372 220 C 337 212, 297 222, 282 230" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 372 250 C 337 242, 297 252, 282 260" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 372 280 C 337 272, 297 282, 282 290" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- E-Commerce Overlay: Shopping Cart Basket emerging from Book -->
    <g filter="url(#cartShadow)">
      <!-- Cart Handle Base & Wireframe Structure -->
      <path d="M 180 150 L 205 150 L 235 270 L 325 270 L 350 180 L 212 180" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Horizontal Grill Reinforcement -->
      <path d="M 220 210 L 342 210" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" />
      <path d="M 227 240 L 333 240" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" />

      <!-- Cart Wheels -->
      <circle cx="245" cy="305" r="16" fill="#ffffff" />
      <circle cx="245" cy="305" r="8" fill="#f43f5e" />

      <circle cx="315" cy="305" r="16" fill="#ffffff" />
      <circle cx="315" cy="305" r="8" fill="#f43f5e" />
    </g>

    <!-- Bookmark Ribbon Accent -->
    <path d="M 256 373 L 256 420 L 240 405 L 224 420 L 224 353 Z" fill="url(#accentGrad)" />

    <!-- Magic / Digital Sparkles -->
    <!-- Top Right Sparkle -->
    <path d="M 380 120 Q 380 140 400 140 Q 380 140 380 160 Q 380 140 360 140 Q 380 140 380 120 Z" fill="#38bdf8" />
    <!-- Small Sparkle -->
    <path d="M 150 120 Q 150 130 160 130 Q 150 130 150 140 Q 150 130 140 130 Q 150 130 150 120 Z" fill="#38bdf8" opacity="0.8" />
  </g>
</svg>